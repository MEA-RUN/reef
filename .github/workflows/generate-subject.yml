name: Generate Subject Site

on:
  workflow_dispatch:
    inputs:
      subject_repo:
        description: 'Subject repository URL (e.g., owner/repo)'
        required: true
        type: string
  push:
    branches: [ main ]
    paths:
      - 'subject/**'
      - 'metadata.json'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-subject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/reef-template
          path: template

      - name: Checkout subject repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.subject_repo || github.repository }}
          path: subject

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./template
        run: npm ci

      - name: Process metadata and download tools
        id: process-metadata
        working-directory: ./template
        run: |
          # Read metadata.json from subject repo
          METADATA_FILE="../subject/metadata.json"
          
          if [ ! -f "$METADATA_FILE" ]; then
            echo "Error: metadata.json not found in subject repository"
            exit 1
          fi
          
          # Create directories
          mkdir -p public/tools
          mkdir -p content/subject
          mkdir -p public/assets
          
          # Parse metadata and download tools
          node scripts/download-tools.js "$METADATA_FILE"
          
          # Copy subject markdown files
          cp -r ../subject/subject/* content/subject/
          
          # Copy assets
          if [ -d "../subject/assets" ]; then
            cp -r ../subject/assets/* public/assets/
          fi
          
          echo "Tools and content processed successfully"

      - name: Build documentation site
        working-directory: ./template
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./template/.output/public

  deploy:
    needs: build-subject
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
